<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title if title else "Shadow Console" }}</title>
  <link rel="icon" id="favicon-link" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script>
    (function () {
      var saved = localStorage.getItem("shadow-theme");
      if (saved) {
        document.documentElement.setAttribute("data-theme", saved);
      }
    })();
  </script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">Shadow Console</a>
    <div class="navbar-nav">
      <a class="nav-link" href="/events">Events</a>
      <a class="nav-link" href="/clients">Clients</a>
      <a class="nav-link" href="/devices">Devices</a>
    </div>
    <button id="theme-toggle" class="btn btn-sm btn-outline-light ms-auto" type="button">
      Toggle Theme
    </button>
  </div>
</nav>

<div class="container my-4">
  {% block content %}{% endblock %}
</div>
<script>
  (function () {
    var btn = document.getElementById("theme-toggle");
    if (!btn) return;
    btn.addEventListener("click", function () {
      var current = document.documentElement.getAttribute("data-theme") || "light";
      var next = current === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("shadow-theme", next);
    });
  })();
</script>
<script src="{{ url_for('static', filename='notify.js') }}"></script>
</body>
</html>
