<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title if title else "Shadow Console" }}</title>
  <link rel="icon" id="favicon-link" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script>
    (function () {
      var root = document.documentElement;
      var theme = localStorage.getItem("shadow-theme");
      if (theme) root.setAttribute("data-theme", theme);
      root.setAttribute("data-bs-theme", (theme || "light") === "light" ? "light" : "dark");
      var accent = localStorage.getItem("shadow-accent");
      if (accent) root.style.setProperty("--sc-accent", accent);
      if (localStorage.getItem("shadow-crt") === "on") root.classList.add("crt-on");
      if (localStorage.getItem("shadow-density") === "compact") root.classList.add("density-compact");
    })();
  </script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">Shadow Console</a>
    <div class="navbar-nav">
      <a class="nav-link" href="/events">Events</a>
      <a class="nav-link" href="/clients">Clients</a>
      <a class="nav-link" href="/devices">Devices</a>
      <a class="nav-link" href="/stats">Stats</a>
    </div>
    <a class="btn btn-sm btn-outline-light ms-auto" href="/settings">Settings</a>
  </div>
</nav>

<div id="crt-overlay" aria-hidden="true"></div>

<div class="container my-4">
  {% block content %}{% endblock %}
</div>
<script src="{{ url_for('static', filename='notify.js') }}"></script>
</body>
</html>
